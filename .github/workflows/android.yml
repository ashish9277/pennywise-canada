
name: Build PennyWise CIBC APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37"

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleFdroidDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PennyWise-CIBC-Android
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
