
name: Build PennyWise CIBC APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      
      - name: Install Android command-line tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -o /tmp/android-tools.zip

          unzip -q /tmp/android-tools.zip -d /tmp/android-tools

          mv /tmp/android-tools/cmdline-tools \
            "$SDK/cmdline-tools/latest"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      
      - name: Check Android SDK availability
        run: |
          sdkmanager --list --channel=3 | grep -E "platforms;android-(36|37)" || true

      - name: Install Android SDK 37
        run: |
          sdkmanager --channel=3 "platforms;android-37"
          sdkmanager "platform-tools"


      - name: Regenerate supported banks documentation
        run: bash scripts/update-supported-banks.sh

      - name: Show generated documentation changes
        run: git status --short

      - name: Build debug APK
        run: ./gradlew :app:assembleFdroidDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PennyWise-CIBC-Android
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
