
name: Build PennyWise CIBC APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Install Android command-line tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -o /tmp/android-tools.zip

          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools \
            "$SDK/cmdline-tools/latest"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "platform-tools"

      
      - name: Regenerate supported banks documentation
        run: |
          bash scripts/update-supported-banks.sh
          git status --short
          git diff -- docs/supported-banks.json

      - name: Upload generated supported banks JSON
        uses: actions/upload-artifact@v4
        with:
          name: updated-supported-banks
          path: docs/supported-banks.json
          if-no-files-found: error

      
      
      - name: Commit updated bank documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/supported-banks.json
          git add pennywise-web/server/src/main/resources/supported-banks.json
          git add fastlane/metadata/android/

          if ! git diff --cached --quiet; then
            git commit -m "Update CIBC Canada supported banks documentation"
            git push origin HEAD:main
          else
            echo "All supported banks documentation is up to date."
          fi

      
      - name: Run parser tests
        run: ./gradlew :parser-core:jvmTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleFdroidDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PennyWise-CIBC-Android
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
