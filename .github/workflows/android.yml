
name: Build PennyWise CIBC APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager || true

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37"

      - name: Regenerate supported banks documentation
        run: bash scripts/update-supported-banks.sh

      - name: Show generated documentation changes
        run: git status --short

      - name: Build debug APK
        run: ./gradlew :app:assembleFdroidDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PennyWise-CIBC-Android
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
